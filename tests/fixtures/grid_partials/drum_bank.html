<section id="drum-bank" class="drum-bank module" data-module="drums.bank" aria-label="The beat"
         >
  <div class="pattern-tools" role="toolbar" aria-label="Drum pattern tools">
    <div class="pt-group" role="group" aria-label="move the beat">
      <button type="button" class="btn btn-s btn-icon pt" hx-post="/fragment/pattern/drums/shift_left" hx-target="#drum-bank" hx-swap="outerMorph"
              data-anim="left" title="Shift the beat a step earlier (wraps round)" aria-label="shift the beat left" data-cmd="Shift the beat left" data-cmd-group="Pattern">◀</button>
      <button type="button" class="btn btn-s btn-icon pt" hx-post="/fragment/pattern/drums/shift_right" hx-target="#drum-bank" hx-swap="outerMorph"
              data-anim="right" title="Shift the beat a step later (wraps round)" aria-label="shift the beat right" data-cmd="Shift the beat right" data-cmd-group="Pattern">▶</button>
      <button type="button" class="btn btn-s btn-icon pt" hx-post="/fragment/pattern/drums/reverse" hx-target="#drum-bank" hx-swap="outerMorph"
              data-anim="flip" title="Reverse the beat" aria-label="reverse the beat" data-cmd="Reverse the beat" data-cmd-group="Pattern">⇆</button>
    </div>
    <div class="pt-group" role="group" aria-label="length, feel and velocity">
      <button type="button" class="btn btn-s pt wide" hx-post="/fragment/pattern/drums/duplicate" hx-target="#drum-bank" hx-swap="outerMorph"
              data-anim="grow" 
              title="Double the beat: the bars you have, twice"
              aria-label="duplicate the beat" data-cmd="Duplicate the beat" data-cmd-group="Pattern">×2</button>
      <span class="pt-menu">
        <button type="button" class="btn btn-s pt wide" popovertarget="ptm-dvel-drum-bank" title="Velocity tools" aria-label="drum velocity tools">vel</button>
        <div popover id="ptm-dvel-drum-bank" class="pop menu pt-menu-panel" role="group" aria-label="drum velocity tools">
          <button type="button" class="menu-item rowtool" popovertarget="ptm-dvel-drum-bank" popovertargetaction="hide" hx-post="/fragment/pattern/drums/vel_humanise" hx-target="#drum-bank" hx-swap="outerMorph"
                  title="Nudge each hit's velocity a little, at random">humanise</button>
          <button type="button" class="menu-item rowtool" popovertarget="ptm-dvel-drum-bank" popovertargetaction="hide" hx-post="/fragment/pattern/drums/vel_ramp" hx-target="#drum-bank" hx-swap="outerMorph"
                  title="Quiet to loud across the loop: a build">ramp ↗</button>
          <button type="button" class="menu-item rowtool" popovertarget="ptm-dvel-drum-bank" popovertargetaction="hide" hx-post="/fragment/pattern/drums/vel_accent" hx-target="#drum-bank" hx-swap="outerMorph"
                  title="Loud on the beat, softer between">accent</button>
          <button type="button" class="menu-item rowtool" popovertarget="ptm-dvel-drum-bank" popovertargetaction="hide" hx-post="/fragment/pattern/drums/vel_reset" hx-target="#drum-bank" hx-swap="outerMorph"
                  title="Every step back to full">reset</button>
        </div>
      </span>
      <button type="button" class="btn btn-s btn-icon pt" hx-post="/fragment/pattern/undo" hx-target="#drum-bank" hx-swap="outerMorph"
              title="Undo the last pattern edit (Ctrl+Z)" aria-label="undo the last pattern edit" data-cmd="Undo the last pattern edit" data-cmd-group="Pattern">↶</button>
    </div>
    <div class="beat-bar" role="toolbar" aria-label="Beat variations and generators">
      <span class="caps">beat</span>
      <div class="seg var-pick" role="group" aria-label="beat variation">
        <button type="button" data-var="A" class="" aria-pressed="true"
                hx-post="/fragment/drums/var" hx-vals='{"var": "A"}' hx-target="#drum-bank" hx-swap="outerMorph"
                data-cmd="Beat variation A" data-keys="Alt+1" data-cmd-group="Pattern"
                title="variation A (on the grid)">A</button>
        <button type="button" data-var="B" class="empty" aria-pressed="false"
                hx-post="/fragment/drums/var" hx-vals='{"var": "B"}' hx-target="#drum-bank" hx-swap="outerMorph"
                data-cmd="Beat variation B" data-keys="Alt+2" data-cmd-group="Pattern"
                title="variation B: empty — a press copies this beat into it">B</button>
        <button type="button" data-var="C" class="empty" aria-pressed="false"
                hx-post="/fragment/drums/var" hx-vals='{"var": "C"}' hx-target="#drum-bank" hx-swap="outerMorph"
                data-cmd="Beat variation C" data-keys="Alt+3" data-cmd-group="Pattern"
                title="variation C: empty — a press copies this beat into it">C</button>
        <button type="button" data-var="D" class="empty" aria-pressed="false"
                hx-post="/fragment/drums/var" hx-vals='{"var": "D"}' hx-target="#drum-bank" hx-swap="outerMorph"
                data-cmd="Beat variation D" data-keys="Alt+4" data-cmd-group="Pattern"
                title="variation D: empty — a press copies this beat into it">D</button>
      </div>
      <span class="pt-menu">
        <button type="button" class="btn btn-s pt wide" popovertarget="ptm-copy-drum-bank" title="Copy the beat on the grid into another variation" aria-label="copy this beat to a variation">copy ▸</button>
        <div popover id="ptm-copy-drum-bank" class="pop menu pt-menu-panel" role="group" aria-label="copy this beat to">
          <button type="button" class="menu-item rowtool" popovertarget="ptm-copy-drum-bank" popovertargetaction="hide" hx-post="/fragment/drums/var" hx-vals='{"var": "B", "copy": "A"}' hx-target="#drum-bank" hx-swap="outerMorph"
                  title="A over B, and switch to it">A → B</button>
          <button type="button" class="menu-item rowtool" popovertarget="ptm-copy-drum-bank" popovertargetaction="hide" hx-post="/fragment/drums/var" hx-vals='{"var": "C", "copy": "A"}' hx-target="#drum-bank" hx-swap="outerMorph"
                  title="A over C, and switch to it">A → C</button>
          <button type="button" class="menu-item rowtool" popovertarget="ptm-copy-drum-bank" popovertargetaction="hide" hx-post="/fragment/drums/var" hx-vals='{"var": "D", "copy": "A"}' hx-target="#drum-bank" hx-swap="outerMorph"
                  title="A over D, and switch to it">A → D</button>
        </div>
      </span>
      <div class="pt-group" role="group" aria-label="generate">
        <button type="button" class="btn btn-s pt wide" hx-post="/fragment/gen" hx-vals='{"kind": "fill"}' hx-target="#drum-bank" hx-swap="outerMorph"
                data-anim="roll" data-cmd="Add a fill" data-cmd-group="Pattern"
                title="A fill in the last bar, in the four-floor style — press again for another (one Ctrl+Z takes them all back)">⚄ fill</button>
        <span class="pt-menu">
          <button type="button" class="btn btn-s btn-icon pt" popovertarget="ptm-fill-drum-bank" title="Fill lengths, and a fill every few bars" aria-label="fill options">▾</button>
          <div popover id="ptm-fill-drum-bank" class="pop menu pt-menu-panel" role="group" aria-label="fill options">
            <button type="button" class="menu-item rowtool" popovertarget="ptm-fill-drum-bank" popovertargetaction="hide" hx-post="/fragment/gen" hx-vals='{&#34;kind&#34;: &#34;fill&#34;, &#34;len&#34;: &#34;0.5&#34;}' hx-target="#drum-bank" hx-swap="outerMorph">the last half bar</button>
            <button type="button" class="menu-item rowtool" popovertarget="ptm-fill-drum-bank" popovertargetaction="hide" hx-post="/fragment/gen" hx-vals='{&#34;kind&#34;: &#34;fill&#34;, &#34;len&#34;: &#34;1&#34;}' hx-target="#drum-bank" hx-swap="outerMorph">the last bar</button>
            <button type="button" class="menu-item rowtool" popovertarget="ptm-fill-drum-bank" popovertargetaction="hide" hx-post="/fragment/gen" hx-vals='{&#34;kind&#34;: &#34;fill&#34;, &#34;len&#34;: &#34;2&#34;}' hx-target="#drum-bank" hx-swap="outerMorph">the last two bars</button>
            <button type="button" class="menu-item rowtool" popovertarget="ptm-fill-drum-bank" popovertargetaction="hide" hx-post="/fragment/gen" hx-vals='{&#34;kind&#34;: &#34;fill&#34;, &#34;every&#34;: &#34;1&#34;, &#34;len&#34;: &#34;0.5&#34;}' hx-target="#drum-bank" hx-swap="outerMorph">every bar</button>
            <button type="button" class="menu-item rowtool" popovertarget="ptm-fill-drum-bank" popovertargetaction="hide" hx-post="/fragment/gen" hx-vals='{&#34;kind&#34;: &#34;fill&#34;, &#34;every&#34;: &#34;2&#34;}' hx-target="#drum-bank" hx-swap="outerMorph">every 2 bars</button>
            <button type="button" class="menu-item rowtool" popovertarget="ptm-fill-drum-bank" popovertargetaction="hide" hx-post="/fragment/gen" hx-vals='{&#34;kind&#34;: &#34;fill&#34;, &#34;every&#34;: &#34;4&#34;}' hx-target="#drum-bank" hx-swap="outerMorph">every 4 bars</button>
          </div>
        </span>
        <button type="button" class="btn btn-s pt wide" hx-post="/fragment/gen" hx-vals='{"kind": "sparser"}' hx-target="#drum-bank" hx-swap="outerMorph"
                data-cmd="Make it sparser" data-cmd-group="Pattern"
                title="The weakest hits out: ghosts first, then what sits between the eighths — never a kick on the beat, never the backbeat">sparser</button>
        <button type="button" class="btn btn-s pt wide" hx-post="/fragment/gen" hx-vals='{"kind": "busier"}' hx-target="#drum-bank" hx-swap="outerMorph"
                data-cmd="Make it busier" data-cmd-group="Pattern"
                title="Hits in: quiet ghosts beside the backbeat, then offbeat hats, then the sixteenths between — never a kick">busier</button>
        <button type="button" class="btn btn-s pt wide" hx-post="/fragment/gen" hx-vals='{"kind": "build"}' hx-target="#drum-bank" hx-swap="outerMorph"
                data-anim="roll" data-cmd="Add a build" data-cmd-group="Pattern"
                title="The beat becomes a roll over the grid's bars (two at least): quarters, eighths, sixteenths, 32nds — the snare getting louder and higher. Ctrl+Z brings the beat back">⚄ build</button>
      </div>
    </div>
    <button type="button" class="btn btn-icon btn-s btn-ghost pt-hint" aria-label="How to draw in the drum grid"
            title="drag across to paint · right-click erases · a row's name selects it: its hits take the lane under the grid (vel / chance / ratchet / nudge / tune) · arrows move, Space toggles, 1-4 ratchet, + − the lane's value, Alt+← → nudge, PageUp / PageDown the lane, Alt+1-4 variation · a row's ⋯ (or a right click on its name) fills, Euclids and shifts it · Ctrl+Z undoes">?</button>
  </div>
  <form id="drum-grid" class="drum-grid"
        hx-post="/fragment/drums/grid" hx-trigger="input delay:150ms, submit" hx-sync="this:queue last" hx-swap="none">
    
    
    <input type="hidden" name="bars" value="2">
    <input type="hidden" name="steps" value="16">
    <input type="hidden" name="hits" value="{&#34;clap.20&#34;: {&#34;r&#34;: 2, &#34;t&#34;: -3.0}, &#34;hat.2&#34;: {&#34;p&#34;: 0.5, &#34;r&#34;: 3}, &#34;kick.0&#34;: {&#34;n&#34;: -0.25, &#34;v&#34;: 0.6}, &#34;kick.16&#34;: {&#34;n&#34;: 0.1, &#34;p&#34;: 0.0, &#34;t&#34;: 5.0}}">
    <input type="hidden" name="rswing" value="{&#34;hat&#34;: 0.2}">
    <input type="hidden" name="rlevel" value="{}">
    <div class="grid drum-grid-8" aria-label="Drum grid" data-bars="2" style="--steps: 32; --rows: 8">
      <i class="playhead" aria-hidden="true" style="grid-row: 1 / span 9"></i>
      
      
      
      
      
      
      <div class="gridrow drumrow silent" role="group" aria-label="kick row" data-voice="kick">
        
        <span class="rowhead" data-ctx-pop="rowmenu-drum-grid-kick">
          <button type="button" class="btn btn-s btn-ghost rowlabel" data-voice="kick" aria-pressed="false" tabindex="0"
                  aria-label="select the kick row" title="kick: hear it · its hits take the lane under the grid (again: every row)">kick</button>
          <button type="button" class="btn btn-s btn-icon rowbtn mute" aria-pressed="false" tabindex="0"
                  hx-post="/fragment/drums/row/kick/mute" hx-target="#drum-bank" hx-swap="outerMorph"
                  aria-label="mute kick">M</button>
          <button type="button" class="btn btn-s btn-icon rowbtn solo" aria-pressed="false" tabindex="0"
                  hx-post="/fragment/drums/row/kick/solo" hx-target="#drum-bank" hx-swap="outerMorph"
                  aria-label="solo kick">S</button>
          <span class="row-menu">
            <button type="button" class="btn btn-s btn-icon rowbtn" tabindex="0" popovertarget="rowmenu-drum-grid-kick" aria-label="kick row tools" title="row tools">⋯</button>
            <div popover id="rowmenu-drum-grid-kick" class="pop row-menu-panel" role="group" aria-label="kick row tools">
              <button type="button" class="btn btn-s rowtool" hx-post="/fragment/drums/row/kick/randomise"
                      hx-include="#drum-bank select[name=style]" hx-target="#drum-bank" hx-swap="outerMorph"
                      aria-label="randomise kick row">⚄ randomise</button>
              <button type="button" class="btn btn-s rowtool" hx-post="/fragment/drums/row/kick/mutate"
                      hx-target="#drum-bank" hx-swap="outerMorph"
                      aria-label="mutate kick row">± mutate</button>
              <button type="button" class="btn btn-s rowtool" hx-post="/fragment/drums/row/kick/clear"
                      hx-target="#drum-bank" hx-swap="outerMorph"
                      aria-label="clear kick row">✕ clear</button>
              
              <span class="rowtool-group" role="group" aria-label="fill the kick row">fill
                <button type="button" class="btn btn-s rowtool" hx-post="/fragment/drums/row/kick/fill1"
                        hx-target="#drum-bank" hx-swap="outerMorph" title="a kick hit every 1 step"
                        aria-label="fill the kick row every 1 steps">1</button>
                <button type="button" class="btn btn-s rowtool" hx-post="/fragment/drums/row/kick/fill2"
                        hx-target="#drum-bank" hx-swap="outerMorph" title="a kick hit every 2 steps"
                        aria-label="fill the kick row every 2 steps">2</button>
                <button type="button" class="btn btn-s rowtool" hx-post="/fragment/drums/row/kick/fill4"
                        hx-target="#drum-bank" hx-swap="outerMorph" title="a kick hit every 4 steps"
                        aria-label="fill the kick row every 4 steps">4</button>
                <button type="button" class="btn btn-s rowtool" hx-post="/fragment/drums/row/kick/fill8"
                        hx-target="#drum-bank" hx-swap="outerMorph" title="a kick hit every 8 steps"
                        aria-label="fill the kick row every 8 steps">8</button>
              </span>
              <button type="button" class="btn btn-s rowtool" hx-post="/fragment/drums/row/kick/shift_left"
                      hx-target="#drum-bank" hx-swap="outerMorph" aria-label="shift the kick row a step earlier" title="shift a step earlier (wraps)">◀</button>
              <button type="button" class="btn btn-s rowtool" hx-post="/fragment/drums/row/kick/shift_right"
                      hx-target="#drum-bank" hx-swap="outerMorph" aria-label="shift the kick row a step later" title="shift a step later (wraps)">▶</button>
              
              <span class="rowtool-group euclid" role="group" aria-label="Euclid the kick row" title="hits spread evenly over steps, then turned: 3 in 8, 5 in 16 …">euclid
                <input class="field field-s" type="number" name="hits" form="euclid-drum-grid-kick" min="0" max="32" value="3" aria-label="kick: Euclid hits">
                in <input class="field field-s" type="number" name="of" form="euclid-drum-grid-kick" min="1" max="32" value="8" aria-label="kick: Euclid steps">
                ↻ <input class="field field-s" type="number" name="rotate" form="euclid-drum-grid-kick" min="0" max="32" value="0" aria-label="kick: Euclid turn">
                <button type="submit" class="btn btn-s rowtool" form="euclid-drum-grid-kick"
                        aria-label="apply Euclid to the kick row">apply</button>
              </span>
              <button type="button" class="btn btn-s rowtool" hx-post="/fragment/drums/row/kick/hitclear"
                      hx-vals='{"voice": "kick"}' hx-target="#drum-bank" hx-swap="outerMorph"
                      title="every kick hit back to plain: no ratchet, chance, nudge, tune or velocity of its own"
                      aria-label="clear the kick row's hit data">plain hits</button>
              
              <select class="field field-s row-sample" name="clip.kick" hx-post="/fragment/drums/sample"
                      hx-vals='{"voice": "kick"}' hx-trigger="change" hx-sync="this:queue last"
                      hx-target="#drum-bank" hx-swap="outerMorph"
                      title="play a clip instead of the synthesized kick"
                      aria-label="sample for the kick row">
                <option value="">synth kick</option><optgroup label="Percussion">
                  
                  <option value="perc:cowbell" >cowbell</option>
                  
                  <option value="perc:shaker" >shaker</option>
                  
                  <option value="perc:conga" >conga</option>
                  
                  <option value="perc:tambourine" >tambourine</option>
                  
                  <option value="perc:clank" >clank</option>
                  
                </optgroup><optgroup label="Clips">
                
                <option value="hit" >hit</option>
                
                </optgroup>
              </select>
              
            </div>
          </span>
          
          <span class="row-knobs">
            <input type="range" id="drum-grid-kick-level" style="--fill: 53.33%" class="knob knob-s" data-row="level" min="0" max="1.5" step="0.01" value="0.8" data-default="1" tabindex="0"
                   aria-label="kick level" title="kick level">
            <input type="range" id="drum-grid-kick-swing" style="--fill: 0.0%" class="knob knob-s" data-row="swing" min="0" max="0.6" step="0.01" value="0.0" data-default="0.0" tabindex="0"
                   aria-label="kick swing" title="kick swing: this row's own, over the kit's (double-click: follow the kit again)">
          </span>
        </span>

          <button type="button" class="btn btn-s btn-ghost rowlabel" data-voice="snare" aria-pressed="false" tabindex="-1"

          <button type="button" class="btn btn-s btn-icon rowbtn mute" aria-pressed="true" tabindex="-1"

        <button type="button" data-lane="p" aria-pressed="false"
                data-cmd="Lane: chance" data-cmd-group="Pattern" data-keys="PageUp / PageDown" title="how often each hit plays: 100 % always, 50 % half the passes — rolled once a pattern, the same every time">chance</button>
        <button type="button" data-lane="r" aria-pressed="false"

        <button type="button" data-lane="n" aria-pressed="false"

                data-cmd="Lane: tune" data-cmd-group="Pattern" data-keys="PageUp / PageDown" title="each hit up or down, to an octave (kick, snare, tom, rim and sampled rows)">tune</button>

              title="the row whose hits the lane shows — press for every row (the steps' shared velocity)">every row</button>

        <label title="the selected row's level (the kit's mixer)">level <input type="range" id="drum-grid-row-level" style="--fill: 66.67%" class="knob" data-row="level" min="0" max="1.5" step="0.01" value="1" data-default="1" disabled

        <label title="the selected row's own swing, over the kit's (double-click: follow the kit again)">swing <input type="range" id="drum-grid-row-swing" style="--fill: 0.0%" class="knob" data-row="swing" min="0" max="0.6" step="0.01" value="0.0" data-default="0.0" disabled
